<style>
  :root{
    --bg:#07090a;
    --bg2:#0d1210;
    --bg3:#121917;
    --line:#1c2422;
    --text:#eef4f1;
    --dim:#7c8f89;
    --accent:#39e0a4;
    --accent-dim:#173b30;
    --danger:#e05d5d;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    display:flex;
    flex-direction:column;
    height:100%;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }

  header{
    padding:calc(16px + env(safe-area-inset-top,0px)) 18px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  header h1{font-size:19px;margin:0;font-weight:700;}
  .icon-btn{
    width:36px;height:36px;border-radius:10px;border:1px solid var(--line);
    background:var(--bg2);display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;
  }
  .icon-btn svg{width:17px;height:17px;stroke:var(--text);fill:none;stroke-width:1.8;}

  .search-bar{
    padding:12px 18px;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .search-bar input{
    width:100%;
    background:var(--bg2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 14px;
    color:var(--text);
    font-size:14px;
    font-family:inherit;
  }
  .search-bar input:focus{outline:none;border-color:var(--accent);}

  main{
    flex:1;
    overflow-y:auto;
    padding:12px 14px calc(90px + env(safe-area-inset-bottom,0px));
  }
  main::-webkit-scrollbar{width:0;}

  .file-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 13px;
    border-radius:13px;
    margin-bottom:7px;
    background:var(--bg2);
    border:1px solid var(--line);
    cursor:pointer;
  }
  .file-row:active{opacity:0.75;}
  .file-icon{font-size:20px;flex-shrink:0;width:24px;text-align:center;}
  .file-info{flex:1;min-width:0;}
  .file-name{font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .file-preview{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
  .file-date{font-size:11px;color:var(--dim);flex-shrink:0;}

  .empty-state{
    margin-top:20vh;
    text-align:center;
    color:var(--dim);
    max-width:280px;
    margin-left:auto;
    margin-right:auto;
    line-height:1.5;
    font-size:14px;
  }
  .empty-state b{color:var(--text);font-weight:600;display:block;margin-bottom:6px;font-size:16px;}

  .fab{
    position:fixed;
    right:20px;
    bottom:calc(24px + env(safe-area-inset-bottom,0px));
    width:58px;height:58px;
    border-radius:50%;
    background:var(--accent);
    border:none;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 20px rgba(57,224,164,.4);
    cursor:pointer;
    z-index:40;
  }
  .fab svg{width:24px;height:24px;stroke:#04120c;fill:none;stroke-width:2.2;}
  .fab-secondary{
    right:90px;
    width:48px;height:48px;
    background:var(--bg2);
    border:1px solid var(--line);
    box-shadow:0 4px 14px rgba(0,0,0,.3);
  }
  .fab-secondary svg{width:19px;height:19px;stroke:var(--text);}

  .drop-overlay{
    position:fixed;
    inset:0;
    background:rgba(57,224,164,.12);
    border:3px dashed var(--accent);
    z-index:150;
    display:none;
    align-items:center;
    justify-content:center;
    pointer-events:none;
  }
  .drop-overlay.show{display:flex;}
  .drop-overlay-inner{
    background:var(--bg3);
    border:1px solid var(--accent);
    border-radius:16px;
    padding:20px 30px;
    font-size:16px;
    font-weight:600;
    color:var(--accent);
  }

  /* editor overlay */
  .editor-overlay{
    position:fixed;
    inset:0;
    background:var(--bg);
    z-index:100;
    display:none;
    flex-direction:column;
  }
  .editor-overlay.open{display:flex;}
  .editor-header{
    display:flex;
    align-items:center;
    gap:10px;
    padding:calc(14px + env(safe-area-inset-top,0px)) 14px 12px;
    border-bottom:1px solid var(--line);
  }
  .editor-header input{
    flex:1;
    background:transparent;
    border:none;
    color:var(--text);
    font-size:16px;
    font-weight:600;
    font-family:inherit;
  }
  .editor-header input:focus{outline:none;}
  #dictateBtn.listening{background:var(--accent);border-color:var(--accent);}
  #dictateBtn.listening svg{stroke:#04120c;}
  .editor-textarea{
    flex:1;
    width:100%;
    background:transparent;
    border:none;
    color:var(--text);
    font-size:15px;
    font-family:ui-monospace,'SF Mono',Menlo,monospace;
    padding:16px 18px;
    line-height:1.65;
    resize:none;
  }
  .editor-textarea:focus{outline:none;}
  .editor-actions{
    display:flex;
    gap:10px;
    padding:14px 18px calc(18px + env(safe-area-inset-bottom,0px));
    border-top:1px solid var(--line);
  }
  .editor-actions button{
    flex:1;padding:13px;border-radius:10px;border:1px solid var(--line);
    background:transparent;color:var(--text);font-size:14px;font-family:inherit;cursor:pointer;
  }
  .editor-actions button.primary{background:var(--accent);color:#04120c;border-color:var(--accent);font-weight:600;}
  .editor-actions #deleteBtn{color:var(--danger);border-color:var(--danger);}

  .toast{
    position:fixed;
    bottom:calc(24px + env(safe-area-inset-bottom,0px));
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--bg3);
    border:1px solid var(--line);
    color:var(--text);
    padding:11px 20px;
    border-radius:100px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s, transform .25s;
    z-index:200;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f7f9f8;--bg2:#ffffff;--bg3:#ffffff;--line:#e2e8e5;--text:#0e1512;--dim:#7a8a84;--accent-dim:#dcf6ea;
    }
    :root:not([data-theme="dark"]) .file-row,:root:not([data-theme="dark"]) .icon-btn{box-shadow:0 1px 3px rgba(0,0,0,.05);}
  }
</style>
</head>

  <div class="editor-header">
    <button class="icon-btn" id="closeEditorBtn"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <input type="text" id="editorTitle" placeholder="Nom du fichier">
    <button class="icon-btn" id="dictateBtn" title="Dicter le contenu">
      <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v4"/></svg>
    </button>
  </div>
  <textarea class="editor-textarea" id="editorContent" placeholder="Écris ton contenu ici, ou appuie sur le micro pour dicter…"></textarea>
  <div id="mediaPreview" style="display:none;flex:1;overflow-y:auto;padding:16px;"></div>
  <div class="editor-actions">
    <button id="deleteBtn">Supprimer</button>
    <button id="saveBtn" class="primary">Enregistrer</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  const FILES_KEY = 'assistant_files_v1';
  let currentId = null;

  const filesMain = document.getElementById('filesMain');
  const emptyState = document.getElementById('emptyState');
  const searchInput = document.getElementById('searchInput');
  const newFileBtn = document.getElementById('newFileBtn');
  const importBtn = document.getElementById('importBtn');
  const fileInput = document.getElementById('fileInput');
  const dropOverlay = document.getElementById('dropOverlay');
  const editorOverlay = document.getElementById('editorOverlay');
  const closeEditorBtn = document.getElementById('closeEditorBtn');
  const editorTitle = document.getElementById('editorTitle');
  const editorContent = document.getElementById('editorContent');
  const mediaPreview = document.getElementById('mediaPreview');
  const saveBtn = document.getElementById('saveBtn');
  const deleteBtn = document.getElementById('deleteBtn');
  const toast = document.getElementById('toast');
  const sortBtn = document.getElementById('sortBtn');
  const goCallBtn = document.getElementById('goCallBtn');
  const dictateBtn = document.getElementById('dictateBtn');

  let sortMode = 'recent'; // recent | name

  function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }
  function buzz(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms || 15); }catch(e){} }
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(()=> toast.classList.remove('show'), 1600);
  }

  function loadFiles(){
    try{ return JSON.parse(localStorage.getItem(FILES_KEY) || '[]'); }
    catch(e){ return []; }
  }
  function saveFiles(files){
    localStorage.setItem(FILES_KEY, JSON.stringify(files));
  }
  function createFile(name, content){
    const files = loadFiles();
    const file = {
      id: 'f_' + Date.now() + '_' + Math.floor(Math.random()*10000),
      name: name || 'sans-titre.txt',
      content: content || '',
      createdAt: Date.now(),
      updatedAt: Date.now()
    };
    files.unshift(file);
    saveFiles(files);
    return file;
  }
  function updateFile(id, name, content){
    const files = loadFiles();
    const f = files.find(x=>x.id===id);
    if(f){ f.name = name || f.name; f.content = content; f.updatedAt = Date.now(); saveFiles(files); }
  }
  function deleteFile(id){
    saveFiles(loadFiles().filter(x=>x.id!==id));
  }
  function fileIconFor(name, content){
    if(typeof content === 'string' && content.startsWith('data:image/')) return '🖼';
    if(typeof content === 'string' && content.startsWith('data:application/pdf')) return '📕';
    const ext = (name.split('.').pop() || '').toLowerCase();
    if(['md','markdown'].includes(ext)) return '📝';
    if(['json'].includes(ext)) return '🗂';
    if(['csv'].includes(ext)) return '📊';
    return '📄';
  }
  function formatDate(ts){
    const d = new Date(ts);
    const now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    if(sameDay) return d.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
    return d.toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit', year:'2-digit'});
  }

  function render(){
    let files = loadFiles();
    const q = searchInput.value.trim().toLowerCase();
    if(q){
      files = files.filter(f => f.name.toLowerCase().includes(q) || (f.content||'').toLowerCase().includes(q));
    }
    if(sortMode === 'name'){
      files = files.slice().sort((a,b)=> a.name.localeCompare(b.name));
    } else {
      files = files.slice().sort((a,b)=> b.updatedAt - a.updatedAt);
    }

    filesMain.innerHTML = '';
    if(files.length === 0){
      filesMain.appendChild(emptyState);
      emptyState.style.display = 'block';
      if(q){
        emptyState.querySelector('b').textContent = 'Aucun résultat';
        emptyState.lastChild.textContent = 'Essaie un autre mot-clé.';
      } else {
        emptyState.querySelector('b').textContent = 'Aucun fichier';
        emptyState.lastChild.textContent = 'Appuie sur le bouton + pour créer ton premier fichier.';
      }
      return;
    }

    files.forEach(f=>{
      const row = document.createElement('div');
      row.className = 'file-row';
      const isMedia = typeof f.content === 'string' && f.content.startsWith('data:');
      const preview = isMedia ? 'Fichier importé' : (f.content || '').replace(/\s+/g,' ').trim().slice(0, 70);
      row.innerHTML = `
        <span class="file-icon">${fileIconFor(f.name, f.content)}</span>
        <div class="file-info">
          <div class="file-name">${escapeHtml(f.name)}</div>
          <div class="file-preview">${escapeHtml(preview || 'Vide')}</div>
        </div>
        <span class="file-date">${formatDate(f.updatedAt)}</span>
      `;
      row.addEventListener('click', ()=> openEditor(f.id));
      filesMain.appendChild(row);
    });
  }

  function openEditor(id){
    if(id){
      const f = loadFiles().find(x=>x.id===id);
      if(!f) return;
      currentId = id;
      editorTitle.value = f.name;
      const isMedia = typeof f.content === 'string' && f.content.startsWith('data:');
      if(isMedia){
        if(f.content.startsWith('data:image/')){
          editorContent.style.display = 'none';
          mediaPreview.innerHTML = `<img src="${f.content}" style="max-width:100%;border-radius:10px;display:block;margin:0 auto;">`;
          mediaPreview.style.display = 'block';
        } else {
          editorContent.style.display = 'none';
          mediaPreview.innerHTML = `<div style="text-align:center;color:var(--dim);padding:40px 20px;">📄 Fichier PDF importé<br>(non prévisualisable ici, mais Jarvis peut l'analyser si tu le mentionnes par son nom)</div>`;
          mediaPreview.style.display = 'block';
        }
      } else {
        editorContent.style.display = '';
        mediaPreview.style.display = 'none';
        editorContent.value = f.content || '';
      }
      deleteBtn.style.display = '';
    } else {
      currentId = null;
      editorTitle.value = '';
      editorContent.value = '';
      editorContent.style.display = '';
      mediaPreview.style.display = 'none';
      deleteBtn.style.display = 'none';
    }
    editorOverlay.classList.add('open');
    setTimeout(()=> (id ? editorContent : editorTitle).focus(), 150);
  }
  function closeEditor(){
    editorOverlay.classList.remove('open');
    currentId = null;
  }

  newFileBtn.addEventListener('click', ()=>{ openEditor(null); buzz(15); });

  // ---- import de fichiers (texte, image, PDF) ----
  const TEXT_EXT = ['txt','md','markdown','csv','json'];

  function readFileAsText(file){
    return new Promise((resolve, reject)=>{
      const r = new FileReader();
      r.onload = ()=> resolve(r.result);
      r.onerror = reject;
      r.readAsText(file);
    });
  }
  function readFileAsDataURL(file){
    return new Promise((resolve, reject)=>{
      const r = new FileReader();
      r.onload = ()=> resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(file);
    });
  }

  async function importFile(file){
    const ext = (file.name.split('.').pop() || '').toLowerCase();
    try{
      if(TEXT_EXT.includes(ext)){
        const text = await readFileAsText(file);
        createFile(file.name, text);
      } else if(file.type.startsWith('image/') || ext === 'pdf'){
        const dataUrl = await readFileAsDataURL(file);
        // stocké tel quel (data:...;base64,...) — Jarvis peut le lire et l'analyser sur demande
        createFile(file.name, dataUrl);
      } else {
        showToast('Type de fichier non pris en charge : ' + file.name);
        return;
      }
      showToast('Importé : ' + file.name);
    }catch(e){
      showToast('Échec import : ' + file.name);
    }
    render();
  }

  async function importFiles(fileList){
    const files = Array.from(fileList || []);
    for(const f of files){
      await importFile(f);
    }
  }

  importBtn.addEventListener('click', ()=>{ fileInput.click(); });
  fileInput.addEventListener('change', ()=>{
    importFiles(fileInput.files);
    fileInput.value = '';
  });

  let dragCounter = 0;
  window.addEventListener('dragenter', (e)=>{
    e.preventDefault();
    dragCounter++;
    dropOverlay.classList.add('show');
  });
  window.addEventListener('dragover', (e)=>{ e.preventDefault(); });
  window.addEventListener('dragleave', (e)=>{
    dragCounter--;
    if(dragCounter <= 0){ dropOverlay.classList.remove('show'); dragCounter = 0; }
  });
  window.addEventListener('drop', (e)=>{
    e.preventDefault();
    dragCounter = 0;
    dropOverlay.classList.remove('show');
    if(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length){
      importFiles(e.dataTransfer.files);
    }
  });

  closeEditorBtn.addEventListener('click', closeEditor);

  saveBtn.addEventListener('click', ()=>{
    const name = editorTitle.value.trim() || 'sans-titre.txt';
    const isMediaOpen = mediaPreview.style.display !== 'none';
    if(isMediaOpen){
      // fichier importé (image/PDF) : on ne modifie que le nom, pas le contenu binaire
      if(currentId){
        const files = loadFiles();
        const f = files.find(x=>x.id===currentId);
        if(f){ f.name = name; f.updatedAt = Date.now(); saveFiles(files); }
      }
      buzz(15);
      showToast('Enregistré');
      render();
      return;
    }
    const content = editorContent.value;
    if(currentId){
      updateFile(currentId, name, content);
    } else {
      const f = createFile(name, content);
      currentId = f.id;
      deleteBtn.style.display = '';
    }
    buzz(15);
    showToast('Enregistré');
    render();
  });

  deleteBtn.addEventListener('click', ()=>{
    if(!currentId) return;
    deleteFile(currentId);
    closeEditor();
    buzz(15);
    showToast('Fichier supprimé');
    render();
  });

  searchInput.addEventListener('input', render);

  sortBtn.addEventListener('click', ()=>{
    sortMode = sortMode === 'recent' ? 'name' : 'recent';
    showToast(sortMode === 'name' ? 'Trié par nom' : 'Trié par date');
    render();
  });

  goCallBtn.addEventListener('click', ()=>{
    window.location.href = '../appel/';
  });

  // ---- dictée vocale dans l'éditeur ----
  (function setupDictation(){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){
      dictateBtn.style.opacity = '0.35';
      dictateBtn.title = 'Dictée non disponible sur ce navigateur';
      return;
    }
    const recog = new SR();
    recog.lang = 'fr-FR';
    recog.interimResults = false;
    recog.continuous = true;
    recog.maxAlternatives = 1;
    let active = false;

    recog.onstart = ()=>{ active = true; dictateBtn.classList.add('listening'); };
    recog.onresult = (e)=>{
      let chunk = '';
      for(let i = e.resultIndex; i < e.results.length; i++){
        if(e.results[i].isFinal) chunk += e.results[i][0].transcript;
      }
      if(chunk.trim()){
        const sep = editorContent.value && !editorContent.value.endsWith('\n') && !editorContent.value.endsWith(' ') ? ' ' : '';
        editorContent.value += sep + chunk.trim();
      }
    };
    recog.onerror = (e)=>{
      if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
        showToast('Accès micro refusé');
      }
    };
    recog.onend = ()=>{
      active = false;
      dictateBtn.classList.remove('listening');
    };

    dictateBtn.addEventListener('click', ()=>{
      if(active){ recog.stop(); }
      else { try{ recog.start(); buzz(15); }catch(e){} }
    });
  })();

      name: "Mes fichiers",
      short_name: "Fichiers",
      start_url: ".",
      display: "standalone",
