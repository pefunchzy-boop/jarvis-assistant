name: Add PWA home-screen support

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch apps + generate manifest and icons
        run: |
          cat > /tmp/pwa_patch.py <<'PYEOF'
          import re, struct, zlib, sys, json, pathlib

          BG = (11, 18, 32, 255)        # fond sombre HUD #0b1220
          ACCENT = (57, 224, 164, 255)  # vert emeraude #39e0a4

          def seg_dist(px, py, ax, ay, bx, by):
              vx, vy = bx - ax, by - ay
              wx, wy = px - ax, py - ay
              c1 = vx * wx + vy * wy
              c2 = vx * vx + vy * vy
              if c2 == 0:
                  return (wx * wx + wy * wy) ** 0.5
              t = max(0.0, min(1.0, c1 / c2))
              dx, dy = ax + t * vx - px, ay + t * vy - py
              return (dx * dx + dy * dy) ** 0.5

          def make_icon(size, path):
              s = float(size)
              cx, cy = 0.5 * s, 0.5 * s
              ring_r, ring_t = 0.30 * s, 0.045 * s
              dot_r = 0.11 * s
              rows = []
              for y in range(size):
                  row = bytearray()
                  for x in range(size):
                      px, py = x + 0.5, y + 0.5
                      d = ((px - cx) ** 2 + (py - cy) ** 2) ** 0.5
                      c = BG
                      if abs(d - ring_r) < ring_t or d < dot_r:
                          c = ACCENT
                      row += bytes(c)
                  rows.append(bytes(row))
              raw = b''.join(b'\x00' + r for r in rows)
              def chunk(tag, data):
                  out = struct.pack('>I', len(data)) + tag + data
                  return out + struct.pack('>I', zlib.crc32(tag + data) & 0xffffffff)
              png = b'\x89PNG\r\n\x1a\n'
              png += chunk(b'IHDR', struct.pack('>IIBBBBB', size, size, 8, 6, 0, 0, 0))
              png += chunk(b'IDAT', zlib.compress(raw, 9))
              png += chunk(b'IEND', b'')
              pathlib.Path(path).write_bytes(png)

          def patch_app(folder, short_name, desc):
              base = pathlib.Path(folder)
              idx = base / 'index.html'
              if not idx.exists():
                  sys.exit('ERREUR: ' + str(idx) + ' introuvable')
              content = idx.read_text(encoding='utf-8')
              if 'apple-mobile-web-app-capable' in content:
                  print(folder + ': deja patche, on passe')
              else:
                  titles = re.findall(r'<title>(.*?)</title>', content)
                  if len(titles) != 1:
                      sys.exit('ERREUR: <title> pas unique dans ' + folder + ', abandon')
                  long_name = titles[0].strip()
                  block = ('<title>' + titles[0] + '</title>\n'
                      '<link rel="manifest" href="manifest.webmanifest">\n'
                      '<meta name="theme-color" content="#0b1220">\n'
                      '<link rel="apple-touch-icon" href="icon-180.png">\n'
                      '<link rel="icon" href="icon-192.png" type="image/png">\n'
                      '<meta name="apple-mobile-web-app-capable" content="yes">\n'
                      '<meta name="mobile-web-app-capable" content="yes">\n'
                      '<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">\n'
                      '<meta name="apple-mobile-web-app-title" content="' + short_name + '">')
                  content = re.sub(r'<title>.*?</title>', lambda m: block, content, count=1)
                  idx.write_text(content, encoding='utf-8')
                  print(folder + ': index.html patche (' + long_name + ')')

              manifest = {
                  "name": desc,
                  "short_name": short_name,
                  "description": desc,
                  "start_url": "./",
                  "scope": "./",
                  "display": "standalone",
                  "background_color": "#0b1220",
                  "theme_color": "#0b1220",
                  "icons": [
                      {"src": "icon-192.png", "sizes": "192x192", "type": "image/png"},
                      {"src": "icon-512.png", "sizes": "512x512", "type": "image/png", "purpose": "any maskable"}
                  ]
              }
              (base / 'manifest.webmanifest').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding='utf-8')
              for sz in (180, 192, 512):
                  make_icon(sz, base / ('icon-' + str(sz) + '.png'))
              print(folder + ': manifest + icones OK')

          patch_app('appel', 'Jarvis', 'Jarvis - assistant vocal')
          patch_app('fichiers', 'Jarvis Fichiers', 'Jarvis - fichiers')
          PYEOF
          python3 /tmp/pwa_patch.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "rien a commiter"; else
            git commit -m "Ajoute icones, manifest et metas iOS (installable plein ecran depuis Safari)"
            git push
          fi
