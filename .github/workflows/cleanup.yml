name: Cleanup unused PWA files

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove unused files and self
        run: |
          git rm -q appel/manifest.webmanifest appel/icon-180.png appel/icon-192.png appel/icon-512.png fichiers/manifest.webmanifest fichiers/icon-180.png fichiers/icon-192.png fichiers/icon-512.png 2>/dev/null || true
          git rm -q .github/workflows/pwa-home-screen.yml .github/workflows/cleanup.yml 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then echo "rien a nettoyer"; else
            git commit -m "Nettoie les fichiers PWA inutiles (les apps avaient deja leurs metas et icones)"
            git push
          fi
